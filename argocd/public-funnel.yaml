apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argocd-funnel-state
  namespace: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-funnel-proxy
  namespace: argocd
data:
  default.conf: |
    server {
      listen 127.0.0.1:8080;

      location / {
        proxy_pass https://argocd-server.argocd.svc.cluster.local:443;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-funnel
  namespace: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argocd-funnel
  template:
    metadata:
      labels:
        app: argocd-funnel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.102.4
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_HOSTNAME
              value: argocd-devops-lab
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
        - name: proxy
          image: nginxinc/nginx-unprivileged:1.30.5-alpine
          ports:
            - name: http-local
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: argocd-funnel-state
        - name: proxy-config
          configMap:
            name: argocd-funnel-proxy
